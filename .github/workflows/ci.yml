# builds and tests Zakuro on Linux, Windows and macOS, and keeps the Windows program
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Sound library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Fonts for Japanese, so the font tests draw with one
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: zakuro-windows
          path: target/release/zakuro.exe
